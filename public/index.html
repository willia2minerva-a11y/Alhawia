<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الهاوية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--c:#00cec9;--g:#d4af37;--r:#e74c3c;--bg:#050403;--bg2:#0d0b08;--card:#080605;--bd:#14201f;--tx:#e8f1f0;--mu:#6f8886;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,sans-serif;overflow-x:hidden;max-width:100vw}
body{background:linear-gradient(180deg,#0d1a1a,var(--bg) 60%);min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
.glow{position:fixed;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(0,206,201,.16),transparent 70%);animation:br 6s ease-in-out infinite;pointer-events:none}
@keyframes br{50%{opacity:.35;transform:scale(1.2)}}
#pt{position:fixed;inset:0;pointer-events:none;z-index:0}
.p{position:absolute;border-radius:50%;background:rgba(0,206,201,.25);box-shadow:0 0 6px rgba(0,206,201,.3);animation:fu linear infinite}
@keyframes fu{0%{transform:translateY(105vh);opacity:0}20%,80%{opacity:1}100%{transform:translateY(-10vh);opacity:0}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(5,4,3,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);box-shadow:0 4px 20px #000}
.logo{font-weight:900;font-size:24px;color:var(--c);text-decoration:none;text-shadow:0 0 16px rgba(0,206,201,.55)}
.ib{background:none;border:1px solid var(--bd);color:var(--c);border-radius:10px;padding:6px 13px;font:700 20px Cairo;cursor:pointer;min-width:44px}
.tk{overflow:hidden;direction:ltr;background:rgba(0,206,201,.07);border-bottom:1px solid rgba(0,206,201,.2);position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:49}
.tk span{display:inline-block;white-space:nowrap;direction:rtl;color:var(--c);font-weight:700;font-size:13px;padding:8px 0;animation:tk 26s linear infinite}
@keyframes tk{from{transform:translateX(-100vw)}to{transform:translateX(100vw)}}
#sb{position:fixed;top:0;bottom:0;right:-300px;width:280px;z-index:100;background:rgba(8,6,5,.98);border-left:1px solid var(--bd);transition:right .35s;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#sb.on{right:0;box-shadow:-10px 0 40px #000}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:90;display:none}#ov.on{display:block}
#sb a{display:block;padding:15px 20px;color:#bcd;text-decoration:none;font-weight:700;font-size:14px;border-bottom:1px solid #101817}
#sb a:active,#sb a.cur{color:var(--c);background:rgba(0,206,201,.06)}
.sh{padding:26px 18px 16px;text-align:center;border-bottom:1px solid #101817}
main{position:relative;z-index:5;max-width:760px;margin:auto;padding:18px 14px 50px}
h1.t{text-align:center;font-size:42px;font-weight:900;margin:8px 0 2px;color:var(--c);text-shadow:0 0 24px rgba(0,206,201,.7),0 0 60px rgba(0,206,201,.3)}
.sub{text-align:center;color:var(--mu);font-size:13px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.03);overflow:hidden;margin-bottom:18px;transition:.3s}
.bn{height:92px;background:linear-gradient(135deg,#0d2a2a,#050403 70%);position:relative}
.bn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(0,206,201,.25),transparent 50%)}
.rw{display:flex;gap:12px;align-items:center;padding:0 14px 12px;margin-top:-34px;position:relative;z-index:2}
.av{width:84px;height:84px;border-radius:50%;border:3px solid var(--c);background:#000;display:grid;place-items:center;font-size:38px;font-weight:900;color:var(--c);flex:none;animation:hb 3s infinite}
@keyframes hb{50%{transform:scale(1.05);box-shadow:0 0 26px rgba(0,206,201,.7)}0%,100%{box-shadow:0 0 14px rgba(0,206,201,.3)}}
.nm{font-weight:900;font-size:20px;color:var(--c);margin:26px 0 0}.un{color:#456;font:12px monospace}
.bd3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 14px 12px}
.bg{background:#000;border:1px solid #14201f;border-radius:7px;padding:6px 2px;text-align:center;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{margin:0 14px 14px;height:12px;border-radius:8px;background:#000;border:1px solid #14201f;overflow:hidden}
.bar i{display:block;height:100%;transition:width .6s}
.lab{display:flex;justify-content:space-between;padding:0 14px 5px;font-size:12px;color:var(--mu);font-weight:700}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{background:linear-gradient(135deg,#0a1010,#030202);border:1px solid var(--bd);border-radius:14px;padding:22px 6px;text-align:center;text-decoration:none;color:#ccc;font-weight:700;font-size:14px;transition:.3s}
.tl:active,.tl:hover{border-color:var(--c);box-shadow:0 0 18px rgba(0,206,201,.2);transform:translateY(-2px)}
.tl b{display:block;font-size:30px;margin-bottom:6px}
.wr{background:rgba(231,76,60,.08);border:1px solid var(--r);color:var(--r);border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:16px}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 14px}
.st div{background:#000;border:1px solid #14201f;border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--mu)}
.st b{display:block;font-size:22px;color:var(--c)}
.btn{background:linear-gradient(135deg,#00cec9,#00968f);color:#001;border:0;border-radius:10px;padding:12px 18px;font:900 15px Cairo;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.96)}.btn.s{padding:6px 10px;font-size:12px}.btn.d{background:linear-gradient(135deg,#e74c3c,#a52a1d);color:#fff}.btn.go{background:linear-gradient(135deg,#d4af37,#9c7d1c)}
input,select{width:100%;background:#000;border:1px solid #1d2c2b;color:#fff;border-radius:10px;padding:12px;font:700 14px Cairo;outline:none}
input:focus{border-color:var(--c);box-shadow:0 0 12px rgba(0,206,201,.2)}
.fm{max-width:380px;margin:30px auto;padding:22px}.fm input{margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;background:#000;border:1px solid var(--bd);color:#9bb;border-radius:10px;padding:10px 12px;font:700 13px Cairo;cursor:pointer}
.tabs button.on{border-color:var(--c);color:var(--c);box-shadow:0 0 12px rgba(0,206,201,.2)}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:7px;border-radius:12px;background:#0a0a09;border:1px solid #14201f;font-weight:700;font-size:14px}
.row .n{width:30px;text-align:center;font-weight:900}.row .v{margin-inline-start:auto;font-family:monospace;color:var(--c)}
.r1{background:linear-gradient(90deg,rgba(212,175,55,.2),#0a0a09);border-color:var(--g);color:var(--g)}
.r2{background:linear-gradient(90deg,rgba(200,210,215,.15),#0a0a09);border-color:#c0c8cc;color:#d8dfe2}
.r3{background:linear-gradient(90deg,rgba(205,127,50,.18),#0a0a09);border-color:#cd7f32;color:#e0a064}
.ch{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.stg{text-align:center;padding:14px}
.face{width:120px;height:120px;margin:auto;border-radius:50%;border:3px solid var(--c);display:grid;place-items:center;font-size:62px;background:radial-gradient(circle,#0d2a2a,#000);box-shadow:0 0 30px rgba(0,206,201,.4);transition:.3s}
.face.angry{animation:sk .4s;border-color:var(--r);box-shadow:0 0 30px rgba(231,76,60,.6)}.face.surprise{animation:jp .4s}.face.sad{transform:rotate(-8deg);filter:saturate(.4)}.face.secret{border-color:var(--g);box-shadow:0 0 40px rgba(212,175,55,.7)}.face.sleep{opacity:.6}.face.scary{border-color:var(--r);filter:contrast(1.4)}
@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes jp{40%{transform:translateY(-16px)}}
#msgs{flex:1;overflow-y:auto;padding:6px 2px}
.m{max-width:85%;padding:10px 13px;border-radius:14px;margin-bottom:8px;font-size:14px;line-height:1.7}
.m.s{background:#0d1c1c;border:1px solid #17302f}.m.u{background:#14120a;border:1px solid #2a2410;margin-inline-start:auto}
.m.g{background:rgba(212,175,55,.1);border:1px solid var(--g);color:var(--g);max-width:100%;text-align:center;font-weight:700}
.cin{display:flex;gap:8px;padding-top:8px}
#toast{position:fixed;top:calc(80px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:300;background:rgba(5,4,3,.97);border:1px solid var(--c);border-radius:10px;padding:11px 18px;font-weight:700;font-size:13px;display:none;max-width:90%;text-align:center}
#intro{position:fixed;inset:0;z-index:500;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
#intro .sk{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;background:none;border:1px solid #234;color:#789;border-radius:8px;padding:6px 12px;font:700 12px Cairo;cursor:pointer;z-index:5}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.2}}
#big{position:absolute;top:35%;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 30px #fff;opacity:0;animation:bs 1.2s .3s forwards,ex .8s 1.3s forwards}
@keyframes bs{to{opacity:1}}@keyframes ex{to{transform:scale(18);opacity:0}}
.wv{position:absolute;top:35%;width:20px;height:20px;border:2px solid var(--c);border-radius:50%;opacity:0;animation:wv 1.6s forwards}
@keyframes wv{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(14)}}
#fl{position:absolute;top:-80px;font-size:60px;animation:fl 2s 1.6s cubic-bezier(.5,0,1,.6) forwards;filter:blur(3px)}
@keyframes fl{to{top:62%;transform:rotate(540deg);filter:blur(0)}}
#fl.hit{display:none}
#iv{position:absolute;bottom:18%;width:100%;text-align:center;opacity:0;animation:ie 1s 4.4s forwards}
@keyframes ie{to{opacity:1}}
#it{font-size:20px;font-weight:900;color:var(--c);min-height:36px;text-shadow:0 0 14px rgba(0,206,201,.7)}
#ib2{opacity:0;margin-top:16px;animation:pl 1.4s infinite}
@keyframes pl{50%{box-shadow:0 0 28px rgba(0,206,201,.8)}}
.shk{animation:sk .5s}
.pop{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px}
.pop div{background:var(--card);border:1px solid var(--g);border-radius:14px;padding:22px;max-width:360px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px 4px;border-bottom:1px solid #14201f;text-align:center}th{color:var(--c)}
td input{padding:5px;font-size:12px;width:62px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
summary{padding:11px 14px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center}
summary small{color:var(--mu);font-weight:400}
.ed,.ad{padding:0 14px 14px}.ed label,.ad label{font-size:11px;color:var(--mu);display:block}.ed input,.ad input,.ad select{margin:3px 0 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2>div{min-width:0}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.row a{min-width:0}
.face:has(.sp){width:auto;height:160px;border:0;border-radius:0;background:none;box-shadow:none;overflow:visible}
.sp{height:100%;width:auto;max-width:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 10px rgba(0,206,201,.55));animation:fy 4s ease-in-out infinite}
.face.angry .sp{filter:drop-shadow(0 0 12px rgba(231,76,60,.8))}.face.secret .sp{filter:drop-shadow(0 0 14px rgba(212,175,55,.9))}
@keyframes fy{50%{transform:translateY(-5px)}}
textarea{width:100%;background:#000;border:1px solid #1d2c2b;color:#fff;border-radius:10px;padding:12px;font:700 14px Cairo;outline:none;margin:4px 0 10px;resize:vertical}textarea:focus{border-color:var(--c)}
.lb{display:block;font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<div class="glow" style="top:-100px;right:-100px"></div><div class="glow" style="bottom:-100px;left:-100px"></div>
<div id="pt"></div><div id="ov"></div>
<nav id="sb"></nav>
<div class="top"><button class="ib" id="mb" aria-label="القائمة">☰</button><a href="#/" class="logo" id="lg">الهاوية</a><span style="width:44px;text-align:center" id="adm"></span></div>
<div class="tk" id="tkw"><span id="tk"></span></div>
<main id="app"></main>
<div id="toast"></div>
<div id="intro">
  <button class="sk" id="skip">تخطي ⏭</button>
  <div id="big"></div><div class="wv" style="animation-delay:1.3s"></div><div class="wv" style="animation-delay:1.6s"></div><div class="wv" style="animation-delay:1.9s"></div>
  <div id="fl">🧍</div>
  <div id="iv"><div style="font-size:54px">💀</div><div id="it"></div><button class="btn" id="ib2">ادخل الهاوية</button></div>
</div>
<script>
const $=s=>document.querySelector(s);
let S={set:{},users:{},words:[],moods:{},posts:[],me:null};const save=()=>{};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const me=()=>S.users[S.me];
const cl=v=>Math.max(0,Math.min(100,v));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
function adj(u,pts,so){const r0=rk(u.pts)[0];u.pts=Math.max(0,u.pts+pts);const r1=rk(u.pts)[0];if(r1<r0)toast('⬇️ نزلت رتبتك إلى '+RK[r1][1]);if(r1>r0)toast('⬆️ ارتقيت إلى رتبة '+RK[r1][1]);u.so=cl(u.so+so);if(u.so<=0&&!u.grave){u.grave=true;u.gr='نفدت أرواحه';toast('💀 سقطتَ إلى المقبرة')}save()}
const hash=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}};
// particles
for(let i=0;i<22;i++){const p=document.createElement('div');p.className='p';const z=Math.random()*3+1;p.style.cssText=`left:${Math.random()*100}vw;width:${z}px;height:${z}px;animation-duration:${6+Math.random()*8}s;animation-delay:${Math.random()*5}s`;$('#pt').appendChild(p)}
// sidebar
const open=v=>{$('#sb').classList.toggle('on',v);$('#ov').classList.toggle('on',v)};
$('#mb').onclick=()=>open(true);$('#ov').onclick=()=>open(false);
function nav(){
 const u=me(),h=location.hash||'#/';
 const L=[['#/','🌌 الساحة الرئيسية']];
 if(u)L.push(['#/san','💬 سانس'],['#/top','🏆 قاعة الأساطير'],['#/grave','⚰️ المقبرة'],['#/me','👤 هويتي'],['#/friends','🤝 الأصدقاء'],['#/ach','🎖 الإنجازات'],['#/info','📚 المعلومات']);
 if(u&&u.adm)L.push(['#/admin','👑 لوحة الإدارة']);
 L.push(u?['#/out','🚪 مغادرة']:['#/login','🔑 دخول']);
 if(!u)L.push(['#/register','📝 انضمام بكود دعوة']);
 $('#sb').innerHTML=`<div class="sh"><div style="display:flex;justify-content:center">${u?AV(u,70):'<div class="av" style="width:70px;height:70px">؟</div>'}</div><div style="color:var(--c);font-weight:900;margin-top:8px">${u?esc(u.d):'ساقط مجهول'}</div><div class="un">${u?'@'+esc(u.u):'---'}</div></div>`+L.map(l=>`<a href="${l[0]}" class="${h==l[0]?'cur':''}">${l[1]}</a>`).join('');
 $('#sb').onclick=e=>{if(e.target.tagName=='A')open(false)};
 $('#adm').innerHTML=u&&u.adm?'<a href="#/admin" style="text-decoration:none;font-size:22px">👑</a>':'';
 $('#lg').textContent=S.set.name;
 $('#tkw').style.display=S.set.tick_on&&S.set.ticker?'block':'none';$('#tk').textContent=S.set.ticker;
}
// views
const bar=(v)=>{const c=v>60?'#00cec9':v>30?'#d4af37':'#e74c3c';return`<div class="lab"><span>الأرواح</span><span>${v}%</span></div><div class="bar"><i style="width:${v}%;background:linear-gradient(90deg,${c}66,${c});box-shadow:0 0 10px ${c}"></i></div>`};
const V={};
V.home=()=>{const u=me();
 if(!u)return`<h1 class="t">${esc(S.set.name)}</h1><p class="sub">مجتمع الساقطين المغلق</p><div class="card fm"><p style="text-align:center;color:var(--mu)">بوابة مغلقة. ادخل أو انضم بكود دعوة.</p><a href="#/login" class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px">دخول</a><a href="#/register" class="btn go" style="display:block;text-align:center;text-decoration:none">انضمام</a></div>`;
 return`<h1 class="t">${esc(S.set.name)}</h1><p class="sub">أهلاً بك في العمق</p>${u.grave?`<div class="wr">⚰️ أنت في المقبرة! قل كلمة العودة لسانس</div>`:''}
 <div class="card"><div class="bn"></div><div class="rw"><div class="av">${esc(u.d[0])}</div><div><div class="nm">${esc(u.d)}</div><div class="un">@${esc(u.u)}</div></div></div>
 <div class="bd3"><div class="bg" style="color:var(--c)">⚡ ${u.pts}</div><div class="bg" style="color:#8fd">💠 ${u.so}%</div><div class="bg" style="color:var(--g)">${esc(u.t||'—')}</div></div>${bar(u.so)}</div>
 <div class="gr"><a class="tl" href="#/san"><b>💬</b>سانس</a><a class="tl" href="#/top"><b>🏆</b>قاعة الأساطير</a><a class="tl" href="#/grave"><b>⚰️</b>المقبرة</a><a class="tl" href="#/me"><b>👤</b>هويتي</a></div>`};
V.login=()=>`<div class="card fm"><h2 style="color:var(--c);text-align:center;margin-top:0">دخول</h2><input id="a" placeholder="اسم المستخدم" autocapitalize="off"><input id="b" type="password" placeholder="كلمة السر"><button class="btn" style="width:100%" id="go">ادخل</button></div>`;
V.register=()=>`<div class="card fm"><h2 style="color:var(--c);text-align:center;margin-top:0">انضمام</h2><input id="a" placeholder="اسم المستخدم (إنجليزي)" autocapitalize="off"><input id="d" placeholder="الاسم المعروض بالعربي"><input id="b" type="password" placeholder="كلمة السر"><input id="i" placeholder="كود الدعوة"><button class="btn go" style="width:100%" id="go">انضم</button></div>`;
const bind={};
bind.login=()=>{$('#go').onclick=async()=>{const k=$('#a').value.trim().toLowerCase(),p=$('#b').value;
 if(k=='admin'&&p=='admin'&&!S.users.admin)S.users.admin={u:'admin',d:'المدير',t:'الحارس',pts:9999,so:100,grave:false,gr:'',sec:[],vio:0,adm:true};
 const u=S.users[k];if(!u)return toast('❌ المستخدم غير موجود');
 const h=await hash(p);if((S.pw[k]||(await hash('1234')))!==h&&!(k=='admin'&&p=='admin'))return toast('❌ كلمة السر خاطئة');
 S.me=k;const t=new Date().toDateString();if(S.day!==k+t){S.day=k+t;adj(u,0,1)}save();location.hash='#/';}};
bind.register=()=>{$('#go').onclick=async()=>{const k=$('#a').value.trim().toLowerCase(),d=$('#d').value.trim(),p=$('#b').value;
 if(!/^[a-z0-9_]{3,20}$/.test(k))return toast('اسم المستخدم: إنجليزي 3-20 حرفاً');if(!d||p.length<4)return toast('أكمل الحقول (كلمة السر 4+)');
 if($('#i').value.trim()!==S.set.invite)return toast('❌ كود الدعوة خاطئ');if(S.users[k])return toast('الاسم مأخوذ');
 S.users[k]={u:k,d,t:'ساقط جديد',pts:0,so:100,grave:false,gr:'',sec:[],vio:0,adm:false};S.pw[k]=await hash(p);S.me=k;save();location.hash='#/'}};

bind.post=()=>{const b=document.querySelector('[data-pd]');if(b)b.onclick=async()=>{if(confirm('حذف هذا المنشور؟')&&await run('admin/post/del',{id:b.dataset.pd}))location.hash='#/info'}};
bind.pedit=()=>{const d=V.pedit.d;if(!d)return;const sy=()=>{d.c=$('#pc').value;d.t=$('#pt').value;d.b=$('#pb').value;d.l=$('#pl').value};
 document.querySelectorAll('[data-xi]').forEach(b=>b.onclick=()=>{sy();d.i.splice(b.dataset.xi,1);render()});
 $('#ai').onclick=()=>{if(d.i.length>=4)return toast('الحد الأقصى 4 صور');sy();pick(800,s=>{d.i.push(s);render()})};
 $('#ps').onclick=async()=>{sy();if(!d.t.trim()||!d.b.trim())return toast('العنوان والمحتوى مطلوبان');if(await run('admin/post',{id:d.id,c:d.c,t:d.t,b:d.b,l:lk(d.l),i:d.i},'✅ تم النشر')){V.pedit.d=null;location.hash='#/info'}}};
// intro
(function(){const it=$('#intro');let seen=false;try{seen=sessionStorage.getItem('hw_intro')}catch(e){}
 const done=()=>{try{sessionStorage.setItem('hw_intro','1')}catch(e){}it.remove();clearInterval(tt)};
 let tt;if(seen){it.remove();return}
 for(let i=0;i<50;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;it.appendChild(s)}
 $('#skip').onclick=done;$('#ib2').onclick=done;
 setTimeout(()=>{$('#fl').classList.add('hit');it.classList.add('shk')},3650);
 setTimeout(()=>{const msg='مرحباً أيها الساقط في الهاوية',el=$('#it');let i=0;tt=setInterval(()=>{el.textContent=msg.slice(0,++i);if(i>=msg.length){clearInterval(tt);$('#ib2').style.opacity=1}},70)},5000);
})();
load().catch(()=>{}).then(render);
</script>
</body>
</html>
